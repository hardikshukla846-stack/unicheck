<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>CampusConnect | Face test</title>
<style>
body{margin:0;padding:20px;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#eceeff;color:#2e2a4f}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:0 0 6px}
p{color:#6a668c;line-height:1.5}
button{border:none;border-radius:16px;padding:14px 22px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(145deg,#a58bff,#7b5cf5);cursor:pointer;box-shadow:6px 8px 16px rgba(123,92,245,.35)}
button:disabled{opacity:.6;cursor:wait}
.cam{margin:16px 0;border-radius:22px;overflow:hidden;background:#1d1a33;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.bar{height:10px;border-radius:8px;background:#dcdff7;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a58bff,#7b5cf5);transition:width .3s}
pre{background:#fff;border-radius:16px;padding:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:120px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Face check test</h1>
  <p>This page tests each step of face recognition on its own. Press the button, allow the camera, blink when asked, and then send the text shown below to your developer.</p>
  <button id="go" type="button">Start test</button>
  <div class="cam"><video id="v" playsinline muted></video></div>
  <div class="bar"><i id="bar"></i></div>
  <pre id="log">Ready.</pre>
</div>
<script type="module">
const $ = id => document.getElementById(id);
const out = $("log");
const log = m => { out.textContent += "\n" + m; out.scrollTop = out.scrollHeight; };
const prog = (m, p) => { $("bar").style.width = (p || 0) + "%"; if (m !== prog.last) { prog.last = m; log("   " + m); } };

$("go").addEventListener("click", async () => {
  const b = $("go"); b.disabled = true; out.textContent = "Starting…";
  let cam = null, F = null;
  try {
    log("Address: " + location.href);
    log("Secure page (camera allowed): " + window.isSecureContext);
    log("Browser: " + navigator.userAgent);

    log("\n1) Loading face.js …");
    F = await import("./face.js");
    log("   face.js loaded ✓");

    log("\n2) Opening the camera …");
    cam = await F.openCamera($("v"));
    log("   Camera works ✓  (" + $("v").videoWidth + "x" + $("v").videoHeight + ")");

    log("\n3) Downloading and loading face recognition …");
    const t1 = performance.now();
    await F.loadFace(prog);
    log("   Loaded ✓ in " + ((performance.now() - t1) / 1000).toFixed(1) + " s");
    log("   Source used: " + F.sourceUsed);

    log("\n4) Speed test (10 detections) …");
    const f = window.faceapi, opts = new f.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.4 });
    let found = 0; const t2 = performance.now();
    for (let i = 0; i < 10; i++) { if (await f.detectSingleFace($("v"), opts).withFaceLandmarks(true)) found++; }
    const ms = (performance.now() - t2) / 10;
    log("   Face seen in " + found + "/10 tries, " + ms.toFixed(0) + " ms per try" + (ms > 400 ? "  (slow phone or computer)" : "  (fine)"));
    if (!found) log("   → Move closer, face a light and keep your face in the picture.");

    log("\n5) Scan 1: blink once when asked …");
    const t3 = performance.now();
    const a = await F.scanFace($("v"), prog);
    log("   Scan 1 done ✓ in " + ((performance.now() - t3) / 1000).toFixed(1) + " s");

    log("\n6) Scan 2: blink once again …");
    await new Promise(r => setTimeout(r, 1200));
    const c = await F.scanFace($("v"), prog);
    const d = F.faceDistance(a, c);
    log("   Scan 2 done ✓");
    log("\nRESULT: the two scans of YOUR face differ by " + d.toFixed(3));
    log("Match limit in the site is " + F.FACE_THRESHOLD + ". " + (d <= F.FACE_THRESHOLD ? "✓ You would be accepted." : "✗ You would be rejected. Better light, or raise FACE_THRESHOLD in face.js."));
    log("\nAll steps passed. Face recognition works on this device.");
  } catch (err) {
    console.error(err);
    log("\n✗ FAILED: " + ((F && F.faceError(err)) || err) );
    log("   Technical detail: " + (err && (err.name + ": " + err.message)));
  } finally {
    if (F) F.closeCamera(cam);
    b.disabled = false; b.textContent = "Run the test again";
  }
});
</script>
</body>
</html>
